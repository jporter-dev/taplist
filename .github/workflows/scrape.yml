name: Scrape taplists

on:
  schedule:
    - cron: "17 */5 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scraper/index.js
        env:
          TAPLIST_API: https://taplist.prtr.dev
          SCRAPER_TOKEN: ${{ secrets.SCRAPER_TOKEN }}

# Venue scraping definitions. Validated 2026-07-11.
#
# Fields:
#   name             venue display name (becomes `location` on each beer)
#   url              page or API endpoint to scrape
#   mode             fetch (static HTML via cheerio, default) | browser (Playwright) | json (API)
#   selector         CSS selector for beer entries (fetch/browser modes)
#   beerSelector     optional sub-selector for the beer name within `selector`
#   brewerySelector  optional sub-selector for the brewery; output is "<brewery> <beer>"
#   listKey          json mode: dot-path to the array in the response
#   fields           json mode: item fields joined with spaces to form the name
#   where            json mode: {field: value} pairs an item must match exactly
#   section          fetch/browser modes: restrict scraping to menu sections whose
#                    header matches; {selector, header, match (case-insens regex)}
#   namefilter       optional named function exported from filters.js
sites:
  - name: Wet City
    url: https://wetcitybrewing.com/
    # The page mixes beer sections with cocktails, wine, and food.
    section:
      selector: 'article.default-menu'
      header: 'h1.entry-title'
      match: 'beer|sours|lager|misc'
    selector: '.items .item .item-header h4.name'
    namefilter: wetCity
  - name: "Max's Taphouse"
    url: https://shop.maxs.com/wp-json/jd/v2/retrieve_customer_draft_list/get_drafts
    mode: json
    listKey: drafts
    fields: [brewery, name]
  - name: The Brass Tap
    url: https://www.brasstapbeerbar.com/beer/Baltimore/draft
    selector: '.beer .beerlisting span'
  - name: Union Craft Brewing
    url: https://www.unioncraftbrewing.com/
    selector: '.list-item-content__text-wrapper h2'
    namefilter: union
  - name: The Ale House Columbia
    url: https://untappd.com/v/the-ale-house-columbia/498845
    mode: browser
    # Skips the Bottle/Can Beer and Beer Flights sections.
    section:
      selector: '.menu-section'
      header: '.menu-section-header'
      match: 'draft'
    selector: '.beer-info'
    beerSelector: 'h5 a'
    brewerySelector: 'h6 a'
    namefilter: stripLeadingNumbers
  - name: Sapwood Cellars
    # Sapwood's menu app API. style doubles as the menu group; unfiltered
    # it also returns bottles, cans, and wines & cocktails.
    url: https://beer-discovery.vercel.app/api/beers
    mode: json
    listKey: beers
    where: { style: Draft Beer }
    fields: [name]
    namefilter: sapwood
  - name: Reckless Shepherd Brewing Co
    # Took over the old Frisco's Taphouse spot in Columbia.
    url: https://untappd.com/v/reckless-shepherd-brewing-co/7236083
    mode: browser
    section:
      selector: '.menu-section'
      header: '.menu-section-header'
      match: 'draft'
    selector: '.beer-info'
    beerSelector: 'h5 a'
    brewerySelector: 'h6 a'
    namefilter: stripLeadingNumbers
  - name: Black Flag Brewing Co
    url: https://untappd.com/v/black-flag-brewing-co/5115855
    mode: browser
    section:
      selector: '.menu-section'
      header: '.menu-section-header'
      match: 'taproom'
    selector: '.beer-info'
    beerSelector: 'h5 a'
    brewerySelector: 'h6 a'
    namefilter: stripLeadingNumbers
  - name: Victoria Gastro Pub
    # Untappd-for-Business embed. Skips the Can & Bottle Selection tab.
    url: https://victoriagastropub.com/draught-list/
    mode: browser
    section:
      selector: '.tab-content'
      header: 'h2'
      match: 'draft'
    selector: '.item-info'
    beerSelector: 'span.item'
    brewerySelector: 'span.item-brewery'

# Dead venues (rechecked 2026-07-12). Untappd only renders menus for venues
# verified with Untappd for Business.
#   Five and Dime Ale House   closed
